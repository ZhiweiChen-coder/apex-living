<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Apex Living MVP system architecture</title><desc id="desc">Browser client connects through two Next.js routes to OpenAI, a local fallback and Supabase.</desc>
  <rect width="1200" height="650" fill="#f7f4ee"/><style>text{font-family:Arial,sans-serif;fill:#14211e}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:14px;fill:#4f5c54}.box{fill:#fffdf8;stroke:#14211e;stroke-width:2}.api{fill:#e9e5dd;stroke:#14211e;stroke-width:2}.external{fill:#d9e0d7;stroke:#14211e;stroke-width:2}.fallback{fill:#f2e6c9;stroke:#92743b;stroke-width:2}.arrow{stroke:#58635c;stroke-width:2.5;fill:none}.arrowhead{fill:#58635c}</style>
  <text x="60" y="70" class="title">Apex Living - System Architecture &amp; Data Flow</text>
  <rect x="60" y="160" width="225" height="115" rx="8" class="box"/><text x="82" y="202" class="label">Visitor browser</text><text x="82" y="229" class="body">Next.js landing page</text><text x="82" y="251" class="body">Chat widget · Booking modal</text>
  <rect x="415" y="100" width="250" height="130" rx="8" class="api"/><text x="438" y="144" class="label">POST /api/chat</text><text x="438" y="171" class="body">Input validation</text><text x="438" y="193" class="body">Prompt guardrails + project context</text>
  <rect x="415" y="365" width="250" height="115" rx="8" class="api"/><text x="438" y="408" class="label">POST /api/bookings</text><text x="438" y="435" class="body">Server-side validation</text><text x="438" y="457" class="body">Service-role persistence</text>
  <rect x="830" y="80" width="250" height="105" rx="8" class="external"/><text x="853" y="123" class="label">OpenAI API</text><text x="853" y="150" class="body">Professional property response</text>
  <rect x="830" y="245" width="250" height="105" rx="8" class="fallback"/><text x="853" y="286" class="label">Local fallback</text><text x="853" y="313" class="body">Listing-guided demo response</text>
  <rect x="830" y="430" width="250" height="105" rx="8" class="external"/><text x="853" y="472" class="label">Supabase</text><text x="853" y="499" class="body">bookings table</text>
  <path d="M285 205H415" class="arrow"/><polygon points="415,205 405,200 405,210" class="arrowhead"/><path d="M285 235V422H415" class="arrow"/><polygon points="415,422 405,417 405,427" class="arrowhead"/><path d="M665 150H830" class="arrow"/><polygon points="830,150 820,145 820,155" class="arrowhead"/><path d="M665 188Q745 298 830 298" class="arrow" stroke-dasharray="8 7"/><polygon points="830,298 820,293 820,303" class="arrowhead"/><path d="M665 422H830" class="arrow"/><polygon points="830,422 820,417 820,427" class="arrowhead"/><text x="695" y="270" class="body">no key / API error</text><text x="102" y="146" class="body">request</text><text x="691" y="131" class="body">LLM request</text><text x="691" y="402" class="body">insert booking</text>
</svg>
